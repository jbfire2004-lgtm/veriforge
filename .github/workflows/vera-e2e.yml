name: Vera E2E

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  nav-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vera-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vera-frontend/package-lock.json
      - run: npm ci
      - run: npm run test:nav-routes
      - run: npm run typecheck
      - run: npm run test:smoke -- tests/inspection-visible-items.smoke.test.ts
      - run: npm run test:component

  playwright-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vera-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vera-frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - name: Require Playwright password secret
        run: |
          if [ -z "${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}" ]; then
            echo "PLAYWRIGHT_TEST_PASSWORD must be set as a repository secret (no CI fallback)." >&2
            exit 1
          fi
      - name: Write Playwright E2E env
        run: |
          mkdir -p playwright/.auth
          cat > playwright/.env.e2e <<EOF
          PLAYWRIGHT_TEST_PASSWORD=${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000
          PLAYWRIGHT_TEST_EMAIL=${{ vars.PLAYWRIGHT_TEST_EMAIL || 'admin@vera.com' }}
          PLAYWRIGHT_ADMIN_EMAIL=${{ vars.PLAYWRIGHT_ADMIN_EMAIL || 'admin@vera.com' }}
          PLAYWRIGHT_PM_EMAIL=${{ vars.PLAYWRIGHT_PM_EMAIL || 'aurora_manager@vera.com' }}
          PLAYWRIGHT_CONTRACTOR_EMAIL=${{ vars.PLAYWRIGHT_CONTRACTOR_EMAIL || 'contractor1@vera.com' }}
          PLAYWRIGHT_STORAGE_STATE_ADMIN=playwright/.auth/admin.json
          PLAYWRIGHT_STORAGE_STATE_PM=playwright/.auth/pm.json
          PLAYWRIGHT_STORAGE_STATE_CONTRACTOR=playwright/.auth/contractor.json
          PLAYWRIGHT_STORAGE_STATE=playwright/.auth/admin.json
          PLAYWRIGHT_DEEP_CRAWL_MOCKS=1
          EOF
      - name: Auth setup (multi-role storage state)
        run: npm run test:e2e:setup
        env:
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3000"
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          PLAYWRIGHT_TEST_EMAIL: ${{ vars.PLAYWRIGHT_TEST_EMAIL || 'admin@vera.com' }}
          PLAYWRIGHT_ADMIN_EMAIL: ${{ vars.PLAYWRIGHT_ADMIN_EMAIL || 'admin@vera.com' }}
          PLAYWRIGHT_PM_EMAIL: ${{ vars.PLAYWRIGHT_PM_EMAIL || 'aurora_manager@vera.com' }}
          PLAYWRIGHT_CONTRACTOR_EMAIL: ${{ vars.PLAYWRIGHT_CONTRACTOR_EMAIL || 'contractor1@vera.com' }}
          CI: "true"
      - name: Run Playwright E2E (public + deep crawl)
        run: npm run test:e2e -- --project=deep-crawl-public --project=public
        env:
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3000"
          CI: "true"
      - name: Run Playwright E2E (authenticated deep crawl)
        run: npm run test:e2e:deep-crawl
        env:
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3000"
          PLAYWRIGHT_STORAGE_STATE_ADMIN: playwright/.auth/admin.json
          PLAYWRIGHT_STORAGE_STATE_PM: playwright/.auth/pm.json
          PLAYWRIGHT_STORAGE_STATE_CONTRACTOR: playwright/.auth/contractor.json
          PLAYWRIGHT_STORAGE_STATE: playwright/.auth/admin.json
          PLAYWRIGHT_DEEP_CRAWL_MOCKS: "1"
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          CI: "true"

  playwright-mocked:
    runs-on: ubuntu-latest
    needs: [playwright-e2e]
    defaults:
      run:
        working-directory: vera-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vera-frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - name: Require Playwright password secret
        run: |
          if [ -z "${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}" ]; then
            echo "PLAYWRIGHT_TEST_PASSWORD must be set as a repository secret (no CI fallback)." >&2
            exit 1
          fi
      - name: Write Playwright E2E env
        run: |
          mkdir -p playwright/.auth
          cat > playwright/.env.e2e <<EOF
          PLAYWRIGHT_TEST_PASSWORD=${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000
          PLAYWRIGHT_TEST_EMAIL=${{ vars.PLAYWRIGHT_TEST_EMAIL || 'admin@vera.com' }}
          PLAYWRIGHT_ADMIN_EMAIL=${{ vars.PLAYWRIGHT_ADMIN_EMAIL || 'admin@vera.com' }}
          PLAYWRIGHT_STORAGE_STATE=playwright/.auth/admin.json
          EOF
      - run: npm run test:e2e:setup
        env:
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3000"
          PLAYWRIGHT_STORAGE_STATE: playwright/.auth/admin.json
          PLAYWRIGHT_TEST_EMAIL: ${{ vars.PLAYWRIGHT_TEST_EMAIL || 'admin@vera.com' }}
          PLAYWRIGHT_ADMIN_EMAIL: ${{ vars.PLAYWRIGHT_ADMIN_EMAIL || 'admin@vera.com' }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          CI: "true"
      - run: npm run test:e2e:mocked
        env:
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3000"
          PLAYWRIGHT_STORAGE_STATE: playwright/.auth/admin.json
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          CI: "true"
