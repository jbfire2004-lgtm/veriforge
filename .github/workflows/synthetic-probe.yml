name: Synthetic Probe

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  probe-stage:
    runs-on: ubuntu-latest
    if: vars.SYNTHETIC_STAGE_BASE_URL != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run stage synthetic probes
        run: node scripts/synthetic-probe.mjs
        env:
          SYNTHETIC_BASE_URL: ${{ vars.SYNTHETIC_STAGE_BASE_URL }}

  probe-prod:
    runs-on: ubuntu-latest
    if: vars.SYNTHETIC_PROD_BASE_URL != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run prod synthetic probes
        run: node scripts/synthetic-probe.mjs
        env:
          SYNTHETIC_BASE_URL: ${{ vars.SYNTHETIC_PROD_BASE_URL }}
