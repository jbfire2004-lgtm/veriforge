name: Services CI

on:
  push:
    paths:
      - 'services/**'
      - '.github/workflows/services-ci.yml'
  pull_request:
    paths:
      - 'services/**'
      - '.github/workflows/services-ci.yml'

jobs:
  critical-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - rbac-service
          - api-gateway
          - offline-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
