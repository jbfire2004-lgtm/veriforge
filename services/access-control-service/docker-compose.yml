services:
  access-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vera_access
      POSTGRES_PASSWORD: vera_access_secret
      POSTGRES_DB: vera_access
    ports:
      - "5446:5432"
    volumes:
      - access_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vera_access -d vera_access"]
      interval: 5s
      timeout: 5s
      retries: 10

  access-control-service:
    build: .
    ports:
      - "3014:3014"
    environment:
      NODE_ENV: production
      PORT: 3014
      DATABASE_URL: postgresql://vera_access:vera_access_secret@access-db:5432/vera_access?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars-long
      AUTH_VALIDATE_URL: http://host.docker.internal:3001/auth/validate-token
      WORKER_SAFETY_SERVICE_URL: http://host.docker.internal:3011
      EQUIPMENT_SAFETY_SERVICE_URL: http://host.docker.internal:3013
      TRAINING_SERVICE_URL: http://host.docker.internal:3012
      PROJECT_SAFETY_SERVICE_URL: http://host.docker.internal:3010
    depends_on:
      access-db:
        condition: service_healthy

volumes:
  access_pg_data:
