services:
  project-safety-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vera_project
      POSTGRES_PASSWORD: vera_project_secret
      POSTGRES_DB: vera_project
    ports:
      - "5442:5432"
    volumes:
      - project_safety_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vera_project -d vera_project"]
      interval: 5s
      timeout: 5s
      retries: 10

  project-safety-service:
    build: .
    ports:
      - "3010:3010"
    environment:
      NODE_ENV: production
      PORT: 3010
      DATABASE_URL: postgresql://vera_project:vera_project_secret@project-safety-db:5432/vera_project?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars-long
      AUTH_VALIDATE_URL: http://host.docker.internal:3001/auth/validate-token
    depends_on:
      project-safety-db:
        condition: service_healthy

volumes:
  project_safety_pg_data:
