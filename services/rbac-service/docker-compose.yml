services:
  rbac-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vera_rbac
      POSTGRES_PASSWORD: vera_rbac_secret
      POSTGRES_DB: vera_rbac
    ports:
      - "5434:5432"
    volumes:
      - rbac_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vera_rbac -d vera_rbac"]
      interval: 5s
      timeout: 5s
      retries: 10

  rbac-service:
    build: .
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://vera_rbac:vera_rbac_secret@rbac-db:5432/vera_rbac?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars-long
      RBAC_SERVICE_KEY: dev-rbac-hook-secret
      PERMISSION_CACHE_TTL_MS: 60000
      AUTH_VALIDATE_URL: http://host.docker.internal:3001/auth/validate-token
    depends_on:
      rbac-db:
        condition: service_healthy

volumes:
  rbac_pg_data:
