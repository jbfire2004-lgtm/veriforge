services:
  cail-explainability-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vera_cail_explain
      POSTGRES_PASSWORD: vera_cail_explain_secret
      POSTGRES_DB: vera_cail_explain
    ports:
      - "5458:5432"
    volumes:
      - cail_explain_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vera_cail_explain -d vera_cail_explain"]
      interval: 5s
      timeout: 5s
      retries: 10

  cail-explainability-service:
    build: .
    ports:
      - "3026:3026"
    environment:
      NODE_ENV: production
      PORT: 3026
      DATABASE_URL: postgresql://vera_cail_explain:vera_cail_explain_secret@cail-explainability-db:5432/vera_cail_explain?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars-long
      AUTH_VALIDATE_URL: http://host.docker.internal:3001/auth/validate-token
      MODEL_KEY: deterministic_rules_v1
    depends_on:
      cail-explainability-db:
        condition: service_healthy

volumes:
  cail_explain_pg_data:
