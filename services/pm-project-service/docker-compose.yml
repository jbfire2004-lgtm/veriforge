services:
  pm-project-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vera_pm_project
      POSTGRES_PASSWORD: vera_pm_project_secret
      POSTGRES_DB: vera_pm_project
    ports:
      - "5450:5432"
    volumes:
      - pm_project_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vera_pm_project -d vera_pm_project"]
      interval: 5s
      timeout: 5s
      retries: 10

  pm-project-service:
    build: .
    ports:
      - "3018:3018"
    environment:
      NODE_ENV: production
      PORT: 3018
      DATABASE_URL: postgresql://vera_pm_project:vera_pm_project_secret@pm-project-db:5432/vera_pm_project?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars-long
      AUTH_VALIDATE_URL: http://host.docker.internal:3001/auth/validate-token
      PROJECT_SAFETY_SERVICE_URL: http://host.docker.internal:3010
    depends_on:
      pm-project-db:
        condition: service_healthy

volumes:
  pm_project_pg_data:
