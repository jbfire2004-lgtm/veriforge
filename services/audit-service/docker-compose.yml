services:
  audit-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vera_audit
      POSTGRES_PASSWORD: vera_audit_secret
      POSTGRES_DB: vera_audit
    ports:
      - "5435:5432"
    volumes:
      - audit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vera_audit -d vera_audit"]
      interval: 5s
      timeout: 5s
      retries: 10

  audit-service:
    build: .
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgresql://vera_audit:vera_audit_secret@audit-db:5432/vera_audit?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars-long
      AUDIT_SERVICE_KEY: dev-audit-ingest-secret
      AUTH_VALIDATE_URL: http://host.docker.internal:3001/auth/validate-token
    depends_on:
      audit-db:
        condition: service_healthy

volumes:
  audit_pg_data:
