apiVersion: apps/v1
kind: Deployment
metadata:
  name: veri-agent
  namespace: veri-agent
  labels:
    app.kubernetes.io/name: veri-agent
    app.kubernetes.io/component: ai-orchestration
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: veri-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: veri-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3040"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: veri-agent
          image: veriforge/veri-agent-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3040
          envFrom:
            - configMapRef:
                name: veri-agent-config
            - secretRef:
                name: veri-agent-secrets
          volumeMounts:
            - name: tenant-overrides
              mountPath: /app/config/policies/tenant-overrides.json
              subPath: tenant-overrides.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tenant-overrides
          configMap:
            name: veri-agent-tenant-overrides
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: veri-agent
  namespace: veri-agent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: veri-agent
