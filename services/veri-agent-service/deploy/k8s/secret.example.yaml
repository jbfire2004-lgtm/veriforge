# Example only — create real secrets via sealed-secrets / external-secrets / CI.
apiVersion: v1
kind: Secret
metadata:
  name: veri-agent-secrets
  namespace: veri-agent
  labels:
    app.kubernetes.io/name: veri-agent
type: Opaque
stringData:
  DATABASE_URL: "postgresql://veri_agent:CHANGE_ME@postgres:5432/veriforge"
  REDIS_URL: "redis://redis:6379"
  VERA_LLM_ENDPOINT: "https://api.openai.com/v1/chat/completions"
  VERA_LLM_API_KEY: "sk-REPLACE_ME"
  VERA_LLM_MODEL: "gpt-4o-mini"
  # Shared with Nest for service-to-service JWT (iss=veriforge, aud=veri-agent)
  JWT_SECRET: "REPLACE_WITH_LONG_RANDOM_SECRET"
  # Optional OTLP collector
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4318"
