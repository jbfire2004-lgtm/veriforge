services:
  pm-task-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vera_pm_task
      POSTGRES_PASSWORD: vera_pm_task_secret
      POSTGRES_DB: vera_pm_task
    ports:
      - "5452:5432"
    volumes:
      - pm_task_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vera_pm_task -d vera_pm_task"]
      interval: 5s
      timeout: 5s
      retries: 10

  pm-task-service:
    build: .
    ports:
      - "3020:3020"
    environment:
      NODE_ENV: production
      PORT: 3020
      DATABASE_URL: postgresql://vera_pm_task:vera_pm_task_secret@pm-task-db:5432/vera_pm_task?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars-long
      AUTH_VALIDATE_URL: http://host.docker.internal:3001/auth/validate-token
      PM_WORK_PACKAGE_SERVICE_URL: http://host.docker.internal:3019
    depends_on:
      pm-task-db:
        condition: service_healthy

volumes:
  pm_task_pg_data:
