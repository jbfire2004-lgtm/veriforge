services:
  jha-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vera_jha
      POSTGRES_PASSWORD: vera_jha_secret
      POSTGRES_DB: vera_jha
    ports:
      - "5439:5432"
    volumes:
      - jha_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vera_jha -d vera_jha"]
      interval: 5s
      timeout: 5s
      retries: 10

  jha-service:
    build: .
    ports:
      - "3007:3007"
    environment:
      NODE_ENV: production
      PORT: 3007
      DATABASE_URL: postgresql://vera_jha:vera_jha_secret@jha-db:5432/vera_jha?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars-long
      AUTH_VALIDATE_URL: http://host.docker.internal:3001/auth/validate-token
      CAPA_SERVICE_URL: http://host.docker.internal:3010/capa
    depends_on:
      jha-db:
        condition: service_healthy

volumes:
  jha_pg_data:
