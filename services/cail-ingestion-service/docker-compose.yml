services:
  cail-ingestion-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vera_cail_ingest
      POSTGRES_PASSWORD: vera_cail_ingest_secret
      POSTGRES_DB: vera_cail_ingest
    ports:
      - "5454:5432"
    volumes:
      - cail_ingest_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vera_cail_ingest -d vera_cail_ingest"]
      interval: 5s
      timeout: 5s
      retries: 10

  cail-ingestion-service:
    build: .
    ports:
      - "3022:3022"
    environment:
      NODE_ENV: production
      PORT: 3022
      DATABASE_URL: postgresql://vera_cail_ingest:vera_cail_ingest_secret@cail-ingestion-db:5432/vera_cail_ingest?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars-long
      AUTH_VALIDATE_URL: http://host.docker.internal:3001/auth/validate-token
      DEFAULT_MODEL_ID: deterministic_rules_v1
      DEFAULT_MODEL_VERSION: 1
    depends_on:
      cail-ingestion-db:
        condition: service_healthy

volumes:
  cail_ingest_pg_data:
