services:
  config-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vera_config
      POSTGRES_PASSWORD: vera_config_secret
      POSTGRES_DB: vera_config
    ports:
      - "5466:5432"
    volumes:
      - config_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vera_config -d vera_config"]
      interval: 5s
      timeout: 5s
      retries: 10

  config-service:
    build: .
    ports:
      - "3034:3034"
    environment:
      NODE_ENV: production
      PORT: 3034
      DATABASE_URL: postgresql://vera_config:vera_config_secret@config-db:5432/vera_config?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars-long
      AUTH_VALIDATE_URL: http://host.docker.internal:3001/auth/validate-token
    depends_on:
      config-db:
        condition: service_healthy

volumes:
  config_pg_data:
