services:
  cail-scoring-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vera_cail_score
      POSTGRES_PASSWORD: vera_cail_score_secret
      POSTGRES_DB: vera_cail_score
    ports:
      - "5455:5432"
    volumes:
      - cail_score_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vera_cail_score -d vera_cail_score"]
      interval: 5s
      timeout: 5s
      retries: 10

  cail-scoring-service:
    build: .
    ports:
      - "3023:3023"
    environment:
      NODE_ENV: production
      PORT: 3023
      DATABASE_URL: postgresql://vera_cail_score:vera_cail_score_secret@cail-scoring-db:5432/vera_cail_score?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars-long
      AUTH_VALIDATE_URL: http://host.docker.internal:3001/auth/validate-token
    depends_on:
      cail-scoring-db:
        condition: service_healthy

volumes:
  cail_score_pg_data:
