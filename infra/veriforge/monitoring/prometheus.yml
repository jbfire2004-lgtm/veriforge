global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: veriforge-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3020"]
        labels:
          service: api

  - job_name: veriforge-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:3021"]
        labels:
          service: worker
