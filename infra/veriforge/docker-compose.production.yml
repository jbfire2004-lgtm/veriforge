# VeriForge production stack
#
#   cp infra/veriforge/env/.env.production.example infra/veriforge/.env
#   docker compose -f infra/veriforge/docker-compose.production.yml --env-file infra/veriforge/.env up -d --build
#
# Services: app (Next.js), api, db (Postgres), redis, worker (cron)

name: veriforge-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veriforge}
      POSTGRES_USER: ${POSTGRES_USER:-veriforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - veriforge_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [veriforge]
    # Do not publish DB ports in production unless required for admin access

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - veriforge_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [veriforge]

  migrate:
    build:
      context: ../../services/veriforge-saas-service
      dockerfile: Dockerfile
    image: ${API_IMAGE:-veriforge-api}:${IMAGE_TAG:-latest}
    command: ["sh", "scripts/migrate-deploy.sh"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-migrate-placeholder}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-migrate-placeholder}
      RUN_DB_SEED: ${RUN_DB_SEED:-0}
      ALLOW_DESTRUCTIVE_MIGRATIONS: ${ALLOW_DESTRUCTIVE_MIGRATIONS:-0}
    depends_on:
      db:
        condition: service_healthy
    networks: [veriforge]
    restart: "no"

  api:
    build:
      context: ../../services/veriforge-saas-service
      dockerfile: Dockerfile
    image: ${API_IMAGE:-veriforge-api}:${IMAGE_TAG:-latest}
    command: ["node", "dist/index.js"]
    restart: unless-stopped
    environment: &api_env
      NODE_ENV: production
      PORT: "3020"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-VeriForge <noreply@veriforge.app>}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://app.veriglobal.ca}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.veriglobal.ca}
      RUN_CRON_IN_API: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3020/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks: [veriforge]

  worker:
    build:
      context: ../../services/veriforge-saas-service
      dockerfile: Dockerfile
    image: ${API_IMAGE:-veriforge-api}:${IMAGE_TAG:-latest}
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      <<: *api_env
      WORKER_HEALTH_PORT: "3021"
      WORKER_MODE: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3021/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks: [veriforge]

  app:
    build:
      context: ../..
      dockerfile: infra/veriforge/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_SITE_URL: ${APP_PUBLIC_URL:-https://app.veriglobal.ca}
    image: ${APP_IMAGE:-veriforge-app}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      VERIFORGE_SAAS_URL: ${VERIFORGE_SAAS_URL:-http://api:3020}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-${APP_PUBLIC_URL:-https://app.veriglobal.ca}}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [veriforge]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/gateway.production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [veriforge]

networks:
  veriforge:
    driver: bridge

volumes:
  veriforge_pg_data:
    name: veriforge_pg_data
  veriforge_redis_data:
    name: veriforge_redis_data
