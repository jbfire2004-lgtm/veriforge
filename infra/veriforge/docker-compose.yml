# VeriForge stack (Compose) — local / staging-style
#   cp infra/veriforge/.env.example infra/veriforge/.env
#   docker compose -f infra/veriforge/docker-compose.yml --env-file infra/veriforge/.env up -d --build
#
# Production (Next.js app + db + redis + worker):
#   docker compose -f infra/veriforge/docker-compose.production.yml --env-file infra/veriforge/.env up -d --build
#   bash scripts/production-deploy.sh --build

name: veriforge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veriforge}
      POSTGRES_USER: ${POSTGRES_USER:-veriforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - veriforge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [veriforge]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - veriforge_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [veriforge]

  migrate:
    build:
      context: ../../services/veriforge-saas-service
      dockerfile: Dockerfile
    command: ["sh", "scripts/migrate-deploy.sh"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-migrate-placeholder}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-migrate-placeholder}
      RUN_DB_SEED: ${RUN_DB_SEED:-1}
      ALLOW_DESTRUCTIVE_MIGRATIONS: ${ALLOW_DESTRUCTIVE_MIGRATIONS:-0}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [veriforge]
    restart: "no"

  api:
    build:
      context: ../../services/veriforge-saas-service
      dockerfile: Dockerfile
    command: ["node", "dist/index.js"]
    restart: unless-stopped
    environment: &api_env
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3020"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-VeriForge <noreply@veriforge.app>}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RUN_CRON_IN_API: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3020/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [veriforge]

  worker:
    build:
      context: ../../services/veriforge-saas-service
      dockerfile: Dockerfile
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      <<: *api_env
      WORKER_HEALTH_PORT: "3021"
      WORKER_MODE: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3021/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [veriforge]

  frontend:
    build:
      context: ../../apps/veriforge-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [veriforge]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [veriforge]

  # Optional local S3-compatible storage
  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-veriforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-veriforgesecret}
    volumes:
      - veriforge_minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks: [veriforge]

networks:
  veriforge:
    driver: bridge

volumes:
  veriforge_pg:
  veriforge_redis:
  veriforge_minio:
