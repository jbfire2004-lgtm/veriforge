# EXAMPLE ONLY — enable after installing External Secrets Operator.
# Do not include in kustomization until the CRDs exist in the cluster.
# Prefer this over committing secrets.example values or broad kubeconfigs.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: veriforge-cluster-store
spec:
  provider:
    # Replace with vault / aws / gcp / azure — example shape for Vault KV v2:
    vault:
      server: "https://vault.example:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "veriforge"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: veriforge-secrets
  namespace: veriforge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: veriforge-cluster-store
    kind: ClusterSecretStore
  target:
    name: veriforge-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: veriforge/prod
        property: DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: veriforge/prod
        property: REDIS_URL
    - secretKey: JWT_ACCESS_SECRET
      remoteRef:
        key: veriforge/prod
        property: JWT_ACCESS_SECRET
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: veriforge/prod
        property: JWT_REFRESH_SECRET
    - secretKey: FIELD_ENCRYPTION_KEY
      remoteRef:
        key: veriforge/prod
        property: FIELD_ENCRYPTION_KEY
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: veriforge/prod
        property: STRIPE_SECRET_KEY
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: veriforge/prod
        property: STRIPE_WEBHOOK_SECRET
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: veriforge/prod
        property: RESEND_API_KEY
    - secretKey: PLATFORM_ADMIN_EMAILS
      remoteRef:
        key: veriforge/prod
        property: PLATFORM_ADMIN_EMAILS
