apiVersion: v1
kind: ConfigMap
metadata:
  name: veriforge-config
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  CORS_ORIGIN: "https://app.veriglobal.ca"
  APP_PUBLIC_URL: "https://app.veriglobal.ca"
  EMAIL_FROM: "VeriForge <noreply@veriglobal.ca>"
  RUN_CRON_IN_API: "false"
  CURRENCY: "USD"
  TRIAL_DAYS: "7"
  ANNUAL_DISCOUNT_PERCENT: "17"
