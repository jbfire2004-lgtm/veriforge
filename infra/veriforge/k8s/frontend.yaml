apiVersion: apps/v1
kind: Deployment
metadata:
  name: veriforge-frontend
  namespace: veriforge
  labels:
    app.kubernetes.io/name: veriforge-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: veriforge-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: veriforge-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/OWNER/veriforge-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: veriforge-frontend
  namespace: veriforge
spec:
  selector:
    app.kubernetes.io/name: veriforge-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
