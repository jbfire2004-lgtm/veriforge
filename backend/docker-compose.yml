services:
  postgres:
    image: postgres:16-alpine
    container_name: vera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vera
    ports:
      - "5432:5432"
    volumes:
      - vera_pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/02-vera-shadow.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vera"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vera_pgdata:
